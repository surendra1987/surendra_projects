query mod_label_download($input: totara_mobile_download_activity_input!) {
  mod_label_download(input: $input) {
    id
    instanceid
    name
    introformat
    intro(format: MOBILE)
    attachments {
      file_url
      file_size
      __typename
    }
    showdescription
    completionstatus
    completion
    completionenabled
    downloadsize
    __typename
  }
}
