# @deprecated since Totara 19.1 in favour of mobile_completedlearning_my_items
query totara_mobile_completed_learning($pointer: Int) {
  completedLearning: mobile_completedlearning_my_items(pointer: $pointer) {
    pointer
    total
    completedLearning {
      id
      itemtype
      itemcomponent
      shortname
      fullname
      summary: description(format: MOBILE)
      summaryFormat: description_format
      progress
      urlView: url_view
      duedate(format: ISO8601)
      duedateState: duedate_state
      native: mobile_coursecompat
      imageSrc: mobile_image
      __typename
    }
    __typename
  }
}
