query totara_webhook_totara_webhooks(
  $input: totara_webhook_totara_webhooks_input!
) {
  totara_webhooks: totara_webhook_totara_webhooks(input: $input) {
    items {
      __typename
      id
      name
      endpoint
      events
      immediate
      created_at
      updated_at
      status
    }
    total
    next_cursor
  }
}
