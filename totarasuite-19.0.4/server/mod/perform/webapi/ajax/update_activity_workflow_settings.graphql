# @deprecated since Totara 19.0 Use update_activity_closure_settings instead.
mutation mod_perform_update_activity_workflow_settings(
  $input: workflow_settings!
    @deprecated(
      reason: "Use mod_perform_update_activity_closure_settings instead"
    )
) {
  mod_perform_update_activity_workflow_settings(input: $input) {
    settings {
      close_on_completion
      close_on_due_date
    }
  }
}
